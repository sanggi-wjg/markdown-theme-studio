name: Release

# v[0-9]* 태그 푸시 → 검증 통과 시 GitHub Release 생성 + 배포 zip 첨부.
# Marketplace 업로드는 정책상 수동 (publishPlugin 미사용).
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # verifyPlugin이 지원 범위 IDE 배포본을 다운로드하므로 여유 있게 잡는다
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # 태그 커밋이 main 조상인지 검증하려면 전체 히스토리가 필요하다
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 미머지 커밋에 태그를 밀면 리뷰 게이트를 우회한 릴리즈가 되므로 차단
      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "FAIL: 태그 커밋이 main에 포함되지 않음 — PR 머지 후 main 커밋에 태그할 것" >&2
            exit 1
          fi

      - name: Check tag matches gradle version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "FAIL: 태그 v${tag} != build.gradle.kts version ${ver} — 버전 bump 커밋을 먼저 머지할 것" >&2
            exit 1
          fi

      # test + buildPlugin + 패키징 검증(plugin.xml 버전·since/until·아이콘·리소스)
      - name: Build and verify packaging
        run: tools/build-zip.sh

      # 지원 IDE 범위(2025.1~2026.2) 바이너리 호환성 — 릴리즈에서만 도는 무거운 게이트
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
